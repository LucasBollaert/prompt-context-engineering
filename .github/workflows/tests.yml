name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Hashes
        run: python scripts_manifest.py --check
      - name: Launcher tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s launch/tests -v
      - name: Knowledge base tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd referentiel
          python scripts/run_tests.py
          python scripts/registry.py
